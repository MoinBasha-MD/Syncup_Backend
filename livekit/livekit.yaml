# LiveKit server config — see https://docs.livekit.io/home/self-hosting/config/
# for the full reference. Copy this file next to docker-compose.yml, fill in
# the two placeholders below, and generate a real key/secret pair (see
# livekit/README.md) before starting the container.

port: 7880
rtc:
  tcp_port: 7881
  # Single-port UDP mux for all WebRTC media. The previous 50000-50100
  # per-participant port range caps out around ~100 concurrent participants;
  # the mux removes that ceiling (needed for group calls).
  udp_port: 7882
  # Replace with the VPS's public IP — without this, clients behind strict
  # NATs/firewalls can fail to establish media even though signaling works.
  use_external_ip: true

redis:
  address: livekit-redis:6379

keys:
  # devkey: devsecret1234567890  <- example shape only, DO NOT use literally.
  # Generate your own with: docker run --rm livekit/livekit-server generate-keys
  YOUR_API_KEY: YOUR_API_SECRET

# Embedded TURN — relays media for clients on networks that block everything
# except outbound UDP/3478. UDP TURN works without a domain; the domain is only
# needed to issue a TLS cert for TURN-over-TLS.
turn:
  enabled: true
  udp_port: 3478
  # PLACEHOLDER: set to your TURN hostname (e.g. turn.yourdomain.com) when you
  # want TURN-over-TLS; required for cert issuance, not for plain UDP TURN.
  domain: YOUR_TURN_DOMAIN
  # TURN-over-TLS requires a certificate for `domain` — uncomment once a cert
  # is provisioned (cert_file/key_file or letsencrypt) or the server will fail
  # to start.
  # tls_port: 5349
