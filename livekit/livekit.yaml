# LiveKit server config — see https://docs.livekit.io/home/self-hosting/config/
# for the full reference. Copy this file next to docker-compose.yml, fill in
# the two placeholders below, and generate a real key/secret pair (see
# livekit/README.md) before starting the container.

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Replace with the VPS's public IP — without this, clients behind strict
  # NATs/firewalls can fail to establish media even though signaling works.
  use_external_ip: true

redis:
  address: livekit-redis:6379

keys:
  # devkey: devsecret1234567890  <- example shape only, DO NOT use literally.
  # Generate your own with: docker run --rm livekit/livekit-server generate-keys
  YOUR_API_KEY: YOUR_API_SECRET

# Optional but recommended once this is public-facing:
# turn:
#   enabled: true
#   domain: turn.yourdomain.com
#   tls_port: 5349
#   udp_port: 3478
